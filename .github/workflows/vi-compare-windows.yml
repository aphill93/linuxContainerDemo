name: VI Compare (Windows)

# Prerequisite: enable GitHub Pages in repo Settings → Pages → Source: GitHub Actions.
# Reports are then served as HTML at https://aphill93.github.io/linuxContainerDemo/
# so clicking a link in the PR comment opens the rendered HTML directly in the browser.

# on:
#   pull_request:
#     types:
#       - opened
#       - synchronize
#       - reopened

jobs:
  run-vi-compare-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Changed Files and Prepare Base Versions
        shell: pwsh
        run: |
          $changed = git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
            Where-Object { $_ -match '\.vi$' }
          Write-Host "Changed VI files:"
          $changed | ForEach-Object { Write-Host "  $_" }

          # Create a git worktree for the base branch so binary .vi files can be
          # compared safely without manual extraction.
          git worktree add "${{ github.workspace }}\vi-base" "origin/${{ github.base_ref }}"

          # Write the list to a file so the container can read it without
          # multiline environment-variable encoding issues.
          if ($null -eq $changed) {
            New-Item -ItemType File -Path "${{ github.workspace }}\changed-files.txt" -Force | Out-Null
          } else {
            $changed | Out-File -FilePath "${{ github.workspace }}\changed-files.txt" `
              -Encoding utf8NoBOM
          }

      - name: Pull Docker Image from Docker Hub
        run: docker pull nationalinstruments/labview:2026q1-windows

      - name: Run CreateComparisonReport on Changed Files
        shell: pwsh
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:C:\workspace" `
            nationalinstruments/labview:2026q1-windows `
            powershell -File C:\workspace\runvicompare.ps1

      - name: Upload ArthOps Report
        id: upload-ArthOps
        if: always() && hashFiles('vi-compare-reports/ArthOps-diff-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ArthOps-diff-report
          path: vi-compare-reports/ArthOps-diff-report.html

      - name: Upload BeepWrapper Report
        id: upload-BeepWrapper
        if: always() && hashFiles('vi-compare-reports/BeepWrapper-diff-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BeepWrapper-diff-report
          path: vi-compare-reports/BeepWrapper-diff-report.html

      - name: Upload CreateNewProj Report
        id: upload-CreateNewProj
        if: always() && hashFiles('vi-compare-reports/CreateNewProj-diff-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateNewProj-diff-report
          path: vi-compare-reports/CreateNewProj-diff-report.html

      - name: Upload WriteToRandomFile Report
        id: upload-WriteToRandomFile
        if: always() && hashFiles('vi-compare-reports/WriteToRandomFile-diff-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WriteToRandomFile-diff-report
          path: vi-compare-reports/WriteToRandomFile-diff-report.html

      - name: Upload reports to GitHub Pages
        id: upload-pages
        if: always() && hashFiles('vi-compare-reports/*.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: vi-compare-reports/

      - name: Deploy to GitHub Pages
        id: deploy-pages
        if: always() && steps.upload-pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Post PR Comment with Report Links
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const changedFilesPath = path.join(process.env.GITHUB_WORKSPACE, 'changed-files.txt');
            if (!fs.existsSync(changedFilesPath)) return;

            const changedFiles = fs.readFileSync(changedFilesPath, 'utf8')
              .split('\n')
              .map(f => f.trim())
              .filter(f => f.endsWith('.vi'));

            if (changedFiles.length === 0) return;

            // Use GitHub Pages URL when available so the HTML opens directly in the
            // browser. Fall back to the artifact zip download if Pages isn't enabled.
            const pagesUrl = '${{ steps.deploy-pages.outputs.page_url }}';
            const artifactUrls = {
              'ArthOps': '${{ steps.upload-ArthOps.outputs.artifact-url }}',
              'BeepWrapper': '${{ steps.upload-BeepWrapper.outputs.artifact-url }}',
              'CreateNewProj': '${{ steps.upload-CreateNewProj.outputs.artifact-url }}',
              'WriteToRandomFile': '${{ steps.upload-WriteToRandomFile.outputs.artifact-url }}'
            };

            let body = '### VI Comparison Reports (Windows)\n\n';
            body += '| VI File | Report |\n|---------|--------|\n';
            for (const file of changedFiles) {
              const baseName = path.basename(file, '.vi');
              const reportFile = `${baseName}-diff-report.html`;
              let reportLink;
              if (pagesUrl) {
                const base = pagesUrl.endsWith('/') ? pagesUrl : pagesUrl + '/';
                reportLink = `[${reportFile}](${base}${reportFile})`;
              } else {
                const artifactUrl = artifactUrls[baseName];
                reportLink = artifactUrl
                  ? `[${reportFile}](${artifactUrl}) *(zip)*`
                  : 'Not generated';
              }
              body += `| \`${file}\` | ${reportLink} |\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
